name: Build guide-v2 (resolved events)

# Separate from guide.yml on purpose: that job mirrors and parses a dozen+ XMLTV sources and takes
# 20-28 minutes a run, nowhere near fast enough for match-day refreshes. This job only calls two small
# JSON APIs (football-data.org, TheSportsDB), so it can run far more often. It mirrors whatever
# guide.yml last published before adding guide-v2.json (see resolve_v2.py's mirror_published), so the
# two jobs don't fight over what's live on Pages.
#
# Refresh-rate caveat (still unmeasured, flagged in Plan-New-Guide.md 4g): GitHub Actions does not
# guarantee scheduled-workflow timing -- triggers can be delayed under platform load. If real runs lag
# this schedule by more than a few minutes on match days, that's the signal to move this to a small
# always-on host instead of trusting `on: schedule` alone.

on:
  schedule:
    - cron: '*/15 * * * *'       # every 15 minutes; tighten only after confirming GitHub actually keeps up
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: red-carpet-guide-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve guide-v2.json (mirrors the currently-published guide first, then adds it)
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
        run: python3 resolve_v2.py --out public --mirror-base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 3888000 ]; then
            git config user.name "guide-bot"; git config user.email "guide-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep the schedule alive"; git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
