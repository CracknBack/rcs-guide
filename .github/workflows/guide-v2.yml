name: Build guide-v2 (resolved events)

# Separate from guide.yml on purpose: that job mirrors and parses a dozen+ XMLTV sources and takes
# 20-28 minutes a run, nowhere near fast enough for match-day refreshes. This job only calls two small
# JSON APIs (football-data.org, TheSportsDB), so it can run far more often. It mirrors whatever
# guide.yml last published before adding guide-v2.json (see resolve_v2.py's mirror_published), so the
# two jobs don't fight over what's live on Pages.
#
# Refresh-rate caveat (still unmeasured, flagged in Plan-New-Guide.md 4g): GitHub Actions does not
# guarantee scheduled-workflow timing -- triggers can be delayed under platform load. If real runs lag
# this schedule by more than a few minutes on match days, that's the signal to move this to a small
# always-on host instead of trusting `on: schedule` alone.

on:
  schedule:
    # Was slowed to every 30 minutes (2026-10-26) on the mistaken belief the owner's TheSportsDB plan
    # was ~100 calls/hour. It is not: confirmed against TheSportsDB's own published tier docs
    # (2026-11-01) that the Premium/Patreon plan is genuinely 100 calls/MINUTE -- a factor-of-60 error,
    # and resolve_v2.py's own rate limiter (tsdb_rate_limit_wait, margin to 85/min) was already correctly
    # built against the real number the whole time; only this schedule and NEAR_MAX_AGE were ever
    # throttled off the wrong one. Restored to every 15 minutes, the original design -- the in-code
    # limiter paces every call safely against the real quota regardless of how often this job runs, so
    # there is no quota reason to run it any slower than match-day freshness calls for.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: red-carpet-guide-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 20 was too tight -- a real run on 2026-11-01 reached only 10 of 30+ leagues before being killed
    # by this exact ceiling, entirely on TheSportsDB's rate-limit pacing (~42s between windows) plus
    # real 429s/503s, nowhere near this job's own in-code limiter being wrong. 45 gives a cold/throttled
    # run room to actually finish once; resolve_v2.py now checkpoints the cache after every league (not
    # just at the very end), so even a run that still doesn't finish in 45 min leaves the next one with
    # a warmer cache instead of restarting from zero and choking on the same early leagues again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve guide-v2.json (mirrors the currently-published guide first, then adds it)
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
        run: python3 resolve_v2.py --out public --mirror-base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 3888000 ]; then
            git config user.name "guide-bot"; git config user.email "guide-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep the schedule alive"; git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
