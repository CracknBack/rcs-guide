name: Build the Red Carpet guide

on:
  schedule:
    - cron: '23 */8 * * *'      # three times a day
  workflow_dispatch:            # lets you press "Run workflow" yourself

permissions:
  contents: write
  pages: write
  id-token: write

# Same group as guide-v2.yml/epg-first.yml, not its own. deploy-pages replaces the WHOLE site, and
# this job previously ran in its own separate group ("red-carpet-guide") -- meaning it could deploy at
# any moment regardless of what the other two were doing, with nothing stopping two deploys racing.
# Confirmed real: this job's 2026-11-11 06:46 run deleted guide-v2.json and the entire guides/
# directory, because build_guide.py has never heard of either and only republishes what IT builds.
# Sharing one group makes all three jobs take turns instead of racing; the carry-forward step below
# is what stops a turn from being destructive once it has one.
concurrency:
  group: red-carpet-guide-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Put the files in the folders the builder expects (safe if they already are)
        run: |
          mkdir -p scripts config
          if [ -f build_guide.py ]; then mv build_guide.py scripts/; fi
          if [ -f test_build.py ]; then mv test_build.py scripts/; fi
          if [ -f sites.json ]; then mv sites.json config/; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get the open guide grabber (iptv-org/epg)
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg
          cd epg && npm install

      - name: Fetch the last published guide
        run: python3 scripts/build_guide.py fetch-prev --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" --dir prev

      - name: Build the guide
        run: python3 scripts/build_guide.py build --epg epg --out public --work work --prev prev

      # This job's own output never includes guide-v2.json or guides/ -- they are built by the other
      # two jobs sharing this site. Without this step, deploying `public/` as-is deletes both, because
      # deploy-pages replaces the entire site rather than merging into it. Narrow by design: it fetches
      # ONLY the files this job doesn't produce, never index.html/sites/*.xml.gz, which this job has
      # just rebuilt and must not have overwritten with a stale copy.
      - name: Carry forward guide-v2.json and guides/, which this job does not build
        run: python3 scripts/carry_forward.py --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" --out public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 3888000 ]; then
            git config user.name "guide-bot"; git config user.email "guide-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep the schedule alive"; git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
